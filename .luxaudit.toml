# luxaudit — fleet dependency-vulnerability (SCA) config for brother_ql.
# Pinned in the Makefile (LUXAUDIT_VERSION); the pinned pip-audit + the fleet ignore policy
# live in the image, the advisory feed is fetched live on every run. Run via `make audit`
# (folded into `make check`). See luxaudit --doc ONBOARDING / --doc REFERENCE.
#
# POSTURE: reds stay RED and lit. There is intentionally NO [[ignore]] block: a deferred
# vulnerability is the owner's call with a written reason, never a route to green. Fix a
# finding by raising the dependency (or declaring a floor for a transitive), or escalate.

# brother_ql is a LIBRARY: [project].dependencies are ranges and it deliberately ships no
# lockfile, so there is nothing for auto-detect to find. Per luxaudit --doc
# DEPENDENCY-DECLARATION ("A library with dependency RANGES and no lockfile") the scan reads
# an audit-only compile of those ranges, regenerated by `make audit-lock`. Nothing installs
# from it; consumers still resolve the ranges themselves. Its age is its freshness: rerun
# audit-lock whenever the declared dependencies change.
#
# `[python] deps = "none"` would be FALSE here (the library has real runtime dependencies)
# and would read as a clean bill of health over an unaudited supply chain.
[source]
paths = ["requirements/audit.txt"]
